services:
  cpu:
    profiles: [cpu]
    build:
      context: .
      dockerfile: Dockerfile.cpu
    environment:
      DEVICE: cpu
      MODEL: ${MODEL:-scnet}
      AUDIO_NEURAL_CACHE: /cache
    volumes:
      - ./audio:/data:ro
      - ./output:/output
      - ./models:/cache

  gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    environment:
      DEVICE: cuda
      MODEL: ${MODEL:-scnet}
      AUDIO_NEURAL_CACHE: /cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./audio:/data:ro
      - ./output:/output
      - ./models:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
